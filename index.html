<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Grid Runner — OpenClawCity Arcade</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="hud">
    <span id="score">SCORE 0</span>
